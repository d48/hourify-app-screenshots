name: HCTRA Daily Balance Check

on:
  schedule:
    # 13:00 UTC = 7:00 AM Central Standard Time (8:00 AM during Central
    # Daylight Time). GitHub Actions cron does not observe DST.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  check-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check HCTRA balance and email result
        env:
          HCTRA_USERNAME: ${{ secrets.HCTRA_USERNAME }}
          HCTRA_PASSWORD: ${{ secrets.HCTRA_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/check_hctra_balance.py

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hctra-failure-screenshot
          path: /tmp/hctra_failure.png
          if-no-files-found: ignore
